name: Fetch latest articles

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the fetch + summarize pipeline
        env:
          # Add this as a repo secret (Settings → Secrets and variables →
          # Actions) once you have a key from https://aistudio.google.com/apikey.
          # Without it, posts are still created — just with the feed's raw
          # excerpt instead of an AI summary (see scripts/fetch-articles.mjs).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run fetch-articles

      - name: Commit new posts, if any
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "chore: fetch latest WebRTC/MoQ articles"
            git push
          fi
